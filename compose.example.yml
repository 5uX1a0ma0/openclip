services:
  openlist-clipboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: openlist-clipboard:local
    container_name: openlist-clipboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CLIPBOARD_ADDR: ":8080"
      CLIPBOARD_ALLOWED_ORIGIN: "${CLIPBOARD_ALLOWED_ORIGIN:-http://localhost:8080}"
      CLIPBOARD_CREATE_PASSWORD: "${CLIPBOARD_CREATE_PASSWORD:?set CLIPBOARD_CREATE_PASSWORD}"
      CLIPBOARD_MAX_BLOB_BYTES: "${CLIPBOARD_MAX_BLOB_BYTES:-52428800}"
      CLIPBOARD_TRUST_PROXY_HEADERS: "${CLIPBOARD_TRUST_PROXY_HEADERS:-false}"
      CLIPBOARD_VAPID_PUBLIC_KEY: "${CLIPBOARD_VAPID_PUBLIC_KEY:-}"
      CLIPBOARD_VAPID_PRIVATE_KEY: "${CLIPBOARD_VAPID_PRIVATE_KEY:-}"
      CLIPBOARD_VAPID_SUBJECT: "${CLIPBOARD_VAPID_SUBJECT:-}"
      OPENLIST_BASE_URL: "${OPENLIST_BASE_URL:-http://host.docker.internal:5244}"
      OPENLIST_USERNAME: "${OPENLIST_USERNAME:-clipboard}"
      OPENLIST_PASSWORD: "${OPENLIST_PASSWORD:?set OPENLIST_PASSWORD}"
      OPENLIST_OTP_CODE: "${OPENLIST_OTP_CODE:-}"
      OPENLIST_ROOT: "${OPENLIST_ROOT:-/clipboard}"
      OPENLIST_CLIENT_ID: "${OPENLIST_CLIENT_ID:-openlist-clipboard-gateway}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
