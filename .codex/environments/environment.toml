version = 1
name = "OpenList Clipboard Local"

[setup]
script = '''
cd frontend
npm install --no-audit --no-fund
'''

[setup.win32]
script = '''
$repo = if ($env:CODEX_WORKTREE_PATH) {
  $env:CODEX_WORKTREE_PATH
} elseif ($env:CODEX_SOURCE_TREE_PATH) {
  $env:CODEX_SOURCE_TREE_PATH
} else {
  (Get-Location).Path
}

& (Join-Path $repo ".codex\environments\openlist-clipboard-env.ps1") setup
'''

[[actions]]
name = "Install Frontend Dependencies"
icon = "tool"
platform = "win32"
command = '''powershell -NoProfile -ExecutionPolicy Bypass -File .codex\environments\openlist-clipboard-env.ps1 setup'''

[[actions]]
name = "Build Frontend"
icon = "run"
platform = "win32"
command = '''powershell -NoProfile -ExecutionPolicy Bypass -File .codex\environments\openlist-clipboard-env.ps1 build'''

[[actions]]
name = "Test Backend"
icon = "test"
platform = "win32"
command = '''powershell -NoProfile -ExecutionPolicy Bypass -File .codex\environments\openlist-clipboard-env.ps1 test'''

[[actions]]
name = "Verify All"
icon = "test"
platform = "win32"
command = '''powershell -NoProfile -ExecutionPolicy Bypass -File .codex\environments\openlist-clipboard-env.ps1 verify'''
